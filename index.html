<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>Workflow Map</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="authGate" class="auth-gate hidden"></div>
<div id="app">
<header class="topbar">
  <div><div class="eyebrow">WORKFLOW MAP</div><h1 id="pageTitle">ホーム</h1></div>
  <div class="top-actions"><button class="icon-btn" id="helpBtn" aria-label="使い方">？</button><button class="icon-btn" id="syncBtn" aria-label="同期">↻</button></div>
</header>
<div id="modeBanner" class="mode-banner hidden"></div>
<main id="main"></main>
<button id="fab" class="fab" aria-label="新しい案件">＋</button>
<nav class="bottom-nav" aria-label="メインナビゲーション">
<button data-tab="home" class="active"><span>⌂</span><b>ホーム</b></button>
<button data-tab="cases"><span>▦</span><b>案件</b></button>
<button data-tab="mine"><span>◎</span><b>私の担当</b></button>
<button data-tab="history"><span>↺</span><b>履歴</b></button>
<button data-tab="settings"><span>⚙</span><b>設定</b></button>
</nav>
</div>
<div id="sheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true"><section class="sheet"><div class="sheet-handle"></div><div id="sheetContent"></div></section></div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
